name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 08:00 UTC every 4 days to prevent Supabase Free Tier auto-pausing (7-day idle limit)
    - cron: "0 8 */4 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest

    steps:
      - name: Keep Supabase project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Supabase Keep-Alive skipped: SUPABASE_URL and/or SUPABASE_ANON_KEY repository secrets are not configured yet. Add them under Settings -> Secrets and variables -> Actions once your Supabase project is ready."
            exit 0
          fi

          BASE_URL="${SUPABASE_URL%/}"
          ENDPOINT="${BASE_URL}/rest/v1/courses?select=id&limit=1"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${ENDPOINT}")

          echo "Supabase keep-alive ping returned HTTP ${HTTP_STATUS}."

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Supabase keep-alive request failed with HTTP ${HTTP_STATUS}."
            exit 1
          fi
